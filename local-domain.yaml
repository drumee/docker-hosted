services:
  drumee:
    image: drumee/dist:latest
    container_name: drumme
    hostname: drumme
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "443:443/tcp"
      - "80:80/tcp"
      - "10000:10000/udp"
      - "5222:5222/tcp"

    environment:
      - PRIVATE_DOMAIN=local.drumee  # Default domain name
      - DRUMEE_REPO=app.drumee.com # DO NOT CHANGE
      - INFRA_COMPONENTS=all # DO NOT CHANGE
      - DRUMEE_DESCRIPTION=My Drumee Developemt Server # Set yours
      - ADMIN_EMAIL=admin@local.drumee # MANDATORY, set yours. 
      - ACME_EMAIL_ACCOUNT=admin@local.drumee # default to ADMIN_EMAIL. Not need if only private domain
      - STORAGE_BACKUP="" # Optonal, format [user@backup.org:]/path/to/backup 
      - DB_BACKUP="" # Optonal, format [user@backup.org:]/path/to/backup 
      - INSTANCE_TYPE=devel

    volumes:
      # Change myusername to yours
      # DO NOT CHANGE right hand values
      - /home/BASE/.config/local.drumee/storage/db:/srv/db
      - /home/BASE/.config/local.drumee/storage/data:/data
      - /home/BASE/.config/local.drumee/storage/exchange:/exchangearea
      - /home/BASE/build/local.drumee:/mnt/devel
      - /home/BASE:/home/BASE:ro  # Optional, convenient to read your stuf from within the continer
      
    entrypoint: /var/lib/drumee/init.d/loader  # Comment this
    #entrypoint: /bin/bash                     # and uncomment this for debug or trouble shootiing
    stdin_open: true 
    tty: true 
    restart: unless-stopped
